[project]
name = "para-track"
version = "0.1.0"
description = "ParaTrack - Minimalist time tracker (CLI & Web UI) with parallel activity tracking and advanced analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "dateparser>=1.2.0",
    "python-dateutil>=2.8.0",
    "flask>=3.0.0",
    "gunicorn>=20.0.0; sys_platform != 'win32'",
    "waitress>=2.1.0; sys_platform == 'win32'",
]

[project.scripts]
track = "track.cli:run"
t = "track.cli:run"
track-web = "track.web:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["track"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
