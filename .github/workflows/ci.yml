# GitHub Actions CI for paratrack.
#
# Four jobs:
#   1. ui    — installs Node deps and builds the Tailwind/DaisyUI
#              CSS bundle. Runs in parallel with static and unit.
#   2. architecture — runs the local static/security/frontend gate without
#                     Postgres or a browser; it needs Go and npm dependencies.
#   3. unit  — runs on every push / PR. No browser.
#   4. e2e   — builds the binary, starts the server, runs the
#              Playwright suite against it. Requires the chromium
#              browser to be installed in the runner image.
#
# Go jobs use the project's Go version. Only unit and e2e need Postgres. The
# UI and architecture jobs install npm packages; unit and e2e also install
# them for their CSS builds.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  ui:
    name: Build UI (Tailwind + DaisyUI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps
        working-directory: web
        run: npm ci

      - name: Build CSS bundle
        working-directory: web
        run: npm run build

      - name: Typecheck React UI
        working-directory: web
        run: npm run typecheck

      - name: Test React UI helpers
        working-directory: web
        run: npm run test:unit

      - name: Test frontend JavaScript helpers
        working-directory: web
        run: npm run test:js

      - name: Verify output exists
        run: test -s internal/web/static/css/paratrack.css && test -s internal/web/static/ui/app.js && test -s internal/web/static/ui/app.css

  architecture:
    name: Static and architecture checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Node for frontend static checks
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend static check dependencies
        working-directory: web
        run: npm ci

      - name: Verify static, security, architecture and frontend checks
        run: make verify

  unit:
    name: Go unit tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PARATRACK_TEST_PG: postgres://t:t@127.0.0.1:5432/t?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Node + build CSS
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps
        working-directory: web
        run: npm ci

      - name: Build CSS bundle
        working-directory: web
        run: npm run build

      - name: go test
        run: |
          go_packages="$(scripts/go-packages.sh)"
          go test -race -count=1 -p 1 $go_packages

      - name: Coverage
        run: go test -cover -p 1 ./internal/db ./internal/web ./internal/timeparse

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    needs: [ui, architecture, unit]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PARATRACK_DATABASE_URL: postgres://t:t@127.0.0.1:5432/t?sslmode=disable
      PARATRACK_ENV: test
      PARATRACK_PUBLIC_URL: http://127.0.0.1:8888
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node + build CSS
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps
        working-directory: web
        run: npm ci

      - name: Build CSS bundle
        working-directory: web
        run: npm run build

      - name: Build server
        run: go build -o /tmp/paratrack ./cmd/paratrack

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          # Plain chromium download — `--with-deps` would invoke
          # apt-get which fails in a non-privileged context. The
          # ubuntu-latest image already has the shared libs the
          # browser needs.
          python -m playwright install chromium

      - name: Start server
        run: |
          /tmp/paratrack web --addr 127.0.0.1:8888 > /tmp/paratrack.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8888/ >/dev/null && break
            sleep 0.5
          done

      - name: Run Playwright suite
        run: |
          # Preserve the test runner's exit code while capturing its output.
          set -o pipefail
          python e2e/test_dashboard.py 2>&1 | tee /tmp/e2e.log

      - name: Upload e2e artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-log
          path: /tmp/e2e.log
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore
