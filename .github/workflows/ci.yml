# GitHub Actions CI for paratrack.
#
# Three jobs:
#   1. ui    — installs Node deps and builds the Tailwind/DaisyUI
#              CSS bundle. Fast — runs in parallel with unit.
#   2. unit  — runs on every push / PR. Fast, no browser.
#   3. e2e   — builds the binary, starts the server, runs the
#              Playwright suite against it. Requires the chromium
#              browser to be installed in the runner image.
#
# Both Go jobs use the same Go version the project targets.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  ui:
    name: Build UI (Tailwind + DaisyUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps
        working-directory: web
        run: npm ci

      - name: Build CSS bundle
        working-directory: web
        run: npm run build

      - name: Verify output exists
        run: test -s internal/web/static/css/paratrack.css

  unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Node + build CSS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps
        working-directory: web
        run: npm ci

      - name: Build CSS bundle
        working-directory: web
        run: npm run build

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Coverage
        run: go test -cover ./internal/db ./internal/web ./internal/timeparse

      - name: Build
        run: go build -o /tmp/paratrack ./cmd/paratrack

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [ui, unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node + build CSS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps
        working-directory: web
        run: npm ci

      - name: Build CSS bundle
        working-directory: web
        run: npm run build

      - name: Build server
        run: go build -o /tmp/paratrack ./cmd/paratrack

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          # Plain chromium download — `--with-deps` would invoke
          # apt-get which fails in a non-privileged context. The
          # ubuntu-latest image already has the shared libs the
          # browser needs.
          python -m playwright install chromium

      - name: Start server
        run: |
          /tmp/paratrack web --addr 127.0.0.1:8888 > /tmp/paratrack.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8888/ >/dev/null && break
            sleep 0.5
          done

      - name: Run Playwright suite
        run: |
          # Tee so the log is always captured even on success.
          python e2e/test_dashboard.py 2>&1 | tee /tmp/e2e.log
          # Always upload the log as an artefact for debugging.
          echo "E2E finished with exit=$?"

      - name: Upload e2e artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: /tmp/e2e.log
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore