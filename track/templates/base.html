<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Better Track{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1e293b;
        }
        
        h1 {
            color: #22d3ee;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        nav {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }
        
        nav a {
            color: #94a3b8;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        nav a:hover {
            background: #1e293b;
            color: #22d3ee;
        }
        
        nav a.active {
            background: #1e293b;
            color: #22d3ee;
        }
        
        .card {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        
        .card h2 {
            color: #22d3ee;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #334155;
        }
        
        th {
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        .status-active {
            color: #10b981;
            font-weight: 600;
        }
        
        .status-paused {
            color: #f59e0b;
            font-weight: 600;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #22d3ee;
            color: #0f172a;
        }
        
        .btn-primary:hover {
            background: #06b6d4;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-warning {
            background: #f59e0b;
            color: white;
        }
        
        .btn-warning:hover {
            background: #d97706;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.75rem;
        }
        
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            color: #94a3b8;
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        input, select {
            padding: 10px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1rem;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #22d3ee;
        }
        
        .form-inline {
            flex-direction: row;
            align-items: flex-end;
        }
        
        .form-inline .form-group {
            flex: 1;
        }
        
        .actions {
            display: flex;
            gap: 8px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        
        .empty-state h3 {
            margin-bottom: 10px;
        }
        
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-tabs a {
            padding: 8px 16px;
            background: #1e293b;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .filter-tabs a:hover {
            background: #334155;
        }
        
        .filter-tabs a.active {
            background: #22d3ee;
            color: #0f172a;
        }
        
        .total-row {
            font-weight: bold;
            color: #22d3ee;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        <header>
            <h1>⏱️ Better Track</h1>
            <nav>
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
                <a href="/log" class="{% if request.path == '/log' %}active{% endif %}">Log</a>
                <a href="/stats" class="{% if request.path == '/stats' %}active{% endif %}">Stats</a>
            </nav>
        </header>
        
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
