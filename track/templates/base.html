<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ParaTrack{% endblock %}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #282828;
        color: #ebdbb2;
        line-height: 1.6;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        margin-bottom: 30px;
        padding: 20px;
        background: #1d2021;
        border: 4px solid #d79921;
        box-shadow: 8px 8px 0 #d79921;
      }

      h1 {
        color: #d79921;
        font-size: 2.5rem;
        margin-bottom: 15px;
        font-weight: 900;
        text-transform: uppercase;
      }

      nav {
        display: flex;
        gap: 12px;
        margin-top: 15px;
      }

      nav a {
        color: #fff;
        text-decoration: none;
        padding: 10px 20px;
        border: 3px solid #d79921;
        background: #32302f;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.875rem;
        transition: all 0.1s;
        box-shadow: 4px 4px 0 #d79921;
      }

      nav a:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #d79921;
      }

      nav a.active {
        background: #d79921;
        color: #1d2021;
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 #d79921;
      }

      .card {
        background: #1d2021;
        padding: 25px;
        margin-bottom: 20px;
        border: 4px solid #458588;
        box-shadow: 8px 8px 0 #458588;
      }

      .card h2 {
        color: #458588;
        margin-bottom: 20px;
        font-size: 1.75rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      .card-yellow {
        border-color: #d79921;
        box-shadow: 8px 8px 0 #d79921;
      }
      .card-yellow h2 {
        color: #d79921;
      }

      .card-green {
        border-color: #98971a;
        box-shadow: 8px 8px 0 #98971a;
      }
      .card-green h2 {
        color: #98971a;
      }
      

      table {
        width: 100%;
        border-collapse: collapse;
        border: 3px solid #98971a;
      }

      th,
      td {
        text-align: left;
        padding: 14px;
        border: 4px solid #98971a;
        vertical-align: middle;
        box-shadow: 8px 8px 0 #98971a;
      }

      th {
        background: #98971a;
        color: #1d2021;
        font-weight: 900;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      td {
        background: #32302f;
        color: #ebdbb2;
      }

      .status-active {
        color: #1d2021;
        font-weight: 900;
        background: #98971a;
        padding: 4px 12px;
        border: 2px solid #1d2021;
        display: inline-block;
        text-transform: uppercase;
        font-size: 0.75rem;
      }

      .status-paused {
        color: #1d2021;
        font-weight: 900;
        background: #d79921;
        padding: 4px 12px;
        border: 2px solid #1d2021;
        display: inline-block;
        text-transform: uppercase;
        font-size: 0.75rem;
      }

      .btn {
        padding: 12px 24px;
        border: 3px solid #a89984;
        cursor: pointer;
        font-size: 0.875rem;
        font-weight: 900;
        transition: all 0.1s ease-in-out;
        text-decoration: none;
        display: inline-block;
        text-transform: uppercase;
        position: relative;
        color: #1d2021;
        background: #fff; /* Default background */
        box-shadow: 5px 5px 0px #a89984;
      }

      .btn:hover {
        transform: translate(2px, 2px);
        box-shadow: 3px 3px 0px #a89984;
      }

      .btn:active {
        transform: translate(5px, 5px);
        box-shadow: 0px 0px 0px #a89984;
      }

      .btn-primary {
        background-color: #458588;
        color: #ebdbb2;
      }
      .btn-danger {
        background-color: #cc241d;
        color: #ebdbb2;
      }
      .btn-warning {
        background-color: #d79921;
        color: #000;
      }
      .btn-success {
        background-color: #98971a;
        color: #1d2021;
      }

      .btn-sm {
        padding: 8px 16px;
        font-size: 0.75rem;
        box-shadow: 4px 4px 0px #a89984;
      }
      .btn-sm:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px #a89984;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        color: #d79921;
        font-size: 0.875rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      input,
      select {
        padding: 12px;
        border: 3px solid #458588;
        background: #32302f;
        color: #ebdbb2;
        font-size: 1rem;
        font-weight: 600;
        box-shadow: 4px 4px 0 #458588;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: #d79921;
        box-shadow: 2px 2px 0 #d79921;
        transform: translate(2px, 2px);
      }

      .form-inline {
        flex-direction: row;
        align-items: flex-end;
      }

      .form-inline .form-group {
        flex: 1;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .empty-state {
        text-align: center;
        padding: 40px;
        color: #a89984;
        background: #32302f;
        border: 3px dashed #458588;
      }

      .empty-state h3 {
        margin-bottom: 10px;
        font-weight: 900;
        color: #ebdbb2;
      }

      .filter-tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }

      .filter-tabs a {
        padding: 10px 20px;
        background: #32302f;
        color: #ebdbb2;
        text-decoration: none;
        border: 3px solid #458588;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.875rem;
        transition: all 0.1s;
        box-shadow: 4px 4px 0 #458588;
      }

      .filter-tabs a:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #458588;
      }

      .filter-tabs a.active {
        background: #d79921;
        color: #1d2021;
        transform: translate(4px, 4px);
        box-shadow: 0 0 0 #458588;
      }

      .total-row {
        font-weight: 900;
        background: #d79921 !important;
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="container">
      <header>
        <h1>ParaTrack</h1>
      </header>

      <main>{% block content %}{% endblock %}</main>
    </div>
    {% block extra_scripts %}{% endblock %}
  </body>
</html>
