{{define "profile"}}
<div class="max-w-2xl mx-auto space-y-4">
  {{template "flash-banner" .}}

  <div class="card bg-base-100 shadow-sm">
    <div class="card-body p-5">
      <h2 class="card-title text-base font-medium mb-3">Profile</h2>
      <form method="POST" action="/api/profile" class="space-y-3">
        <div>
          <label class="label py-1" for="email"><span class="label-text">Email</span></label>
          <input type="email" id="email" value="{{.User.Email}}" disabled class="input input-bordered w-full opacity-60">
        </div>
        <div>
          <label class="label py-1" for="name"><span class="label-text">Display name</span></label>
          <input type="text" id="name" required minlength="1" name="name" value="{{.User.Name}}"
                 class="input input-bordered w-full">
        </div>
        <button type="submit" class="btn btn-neutral">Save</button>
      </form>
    </div>
  </div>

  <div class="card bg-base-100 shadow-sm">
    <div class="card-body p-5">
      <h2 class="card-title text-base font-medium mb-3">Change password</h2>
      <form method="POST" action="/api/profile/password" class="space-y-3">
        <div>
          <label class="label py-1" for="current_password"><span class="label-text">Current password</span></label>
          <input type="password" id="current_password" name="current_password" autocomplete="current-password"
                 class="input input-bordered w-full">
        </div>
        <div>
          <label class="label py-1" for="new_password"><span class="label-text">New password</span></label>
          <input type="password" id="new_password" name="new_password" required minlength="8" maxlength="72"
                 autocomplete="new-password" class="input input-bordered w-full">
        </div>
        <button type="submit" class="btn btn-neutral">Update password</button>
      </form>
    </div>
  </div>

  {{template "settings-sidebar" .}}
</div>
{{end}}
