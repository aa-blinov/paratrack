{{define "profile"}}
<div class="max-w-2xl mx-auto space-y-4">
  {{template "flash-banner" .}}
  {{template "settings-sidebar" .}}

  <div class="card bg-base-100 border border-base-300">
    <div class="card-body p-5">
      <h2 class="card-title mb-3">{{.T "profile.title"}}</h2>
      <form method="POST" action="/api/profile" class="space-y-3">
        <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
        <div>
          <label class="label py-1" for="email"><span class="label-text">{{.T "auth.email"}}</span></label>
          <input type="email" id="email" value="{{.User.Email}}" disabled class="input input-bordered w-full opacity-60">
        </div>
        <div>
          <label class="label py-1" for="name"><span class="label-text">{{.T "auth.displayName"}}</span></label>
          <input type="text" id="name" required minlength="1" name="name" value="{{.User.Name}}"
                 class="input input-bordered w-full">
        </div>
        <button type="submit" class="btn btn-neutral gap-1.5">{{icon "check"}}{{.T "projects.save"}}</button>
      </form>
    </div>
  </div>

  <div class="card bg-base-100 border border-base-300">
    <div class="card-body p-5">
      <h2 class="card-title mb-3">{{.T "profile.changePassword"}}</h2>
      <form method="POST" action="/api/profile/password" class="space-y-3">
        <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
        <div>
          <label class="label py-1" for="current_password"><span class="label-text">{{.T "profile.currentPassword"}}</span></label>
          <input type="password" id="current_password" name="current_password" autocomplete="current-password"
                 required class="input input-bordered w-full">
        </div>
        <div>
          <label class="label py-1" for="new_password"><span class="label-text">{{.T "auth.newPassword"}}</span></label>
          <input type="password" id="new_password" name="new_password" required minlength="8" maxlength="72"
                 autocomplete="new-password" class="input input-bordered w-full">
        </div>
        <button type="submit" class="btn btn-neutral gap-1.5">{{icon "check"}}{{.T "profile.updatePassword"}}</button>
      </form>
    </div>
  </div>
</div>
{{end}}
