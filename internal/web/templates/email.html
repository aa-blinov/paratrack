{{/* One layout for every letter. Mail clients strip <style> and most
     CSS, so this is tables and inline styles only, flat like the app:
     white sheet, hairline rules, one dark button, figures in mono.
     Light only (color-scheme) so dark-mode clients don't invert it into
     something unreadable. */}}
{{define "email"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{.Heading}}</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f6;-webkit-text-size-adjust:100%;">
<span style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f3f4f6;">{{.Preheader}}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3f4f6;">
<tr><td align="center" style="padding:32px 12px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
    <tr><td style="padding:0 4px 16px 4px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
        {{if .LogoURL}}<td style="padding:0 9px 0 0;vertical-align:middle;"><img src="{{.LogoURL}}" width="22" height="22" alt="" style="display:block;width:22px;height:22px;border:0;border-radius:6px;"></td>{{end}}
        <td style="vertical-align:middle;font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:bold;color:#111827;letter-spacing:-0.3px;">paratrack</td>
      </tr></table>
    </td></tr>
    <tr><td style="background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:28px 28px 24px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif;color:#1f2937;">
      <h1 style="margin:0 0 14px 0;font-size:22px;line-height:1.3;font-weight:600;color:#111827;">{{.Heading}}</h1>
      {{range .Paras}}<p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;color:#374151;">{{.}}</p>{{end}}
      {{if .Amount}}
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:18px 0 6px 0;border-top:2px solid #111827;">
        <tr><td style="padding:12px 0 2px 0;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#6b7280;">{{.AmountLabel}}</td></tr>
        <tr><td style="padding:0 0 4px 0;font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:28px;font-weight:600;color:#111827;white-space:nowrap;">{{.Amount}}</td></tr>
      </table>
      {{end}}
      {{if .Facts}}
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:10px 0 4px 0;">
        {{range .Facts}}
        <tr>
          <td valign="top" style="padding:8px 12px 8px 0;border-bottom:1px solid #e5e7eb;font-size:13px;color:#6b7280;width:38%;">{{.Key}}</td>
          <td valign="top" style="padding:8px 0;border-bottom:1px solid #e5e7eb;font-size:14px;color:#111827;{{if .Mono}}font-family:'SFMono-Regular',Menlo,Consolas,monospace;{{end}}">{{.Value}}</td>
        </tr>
        {{end}}
      </table>
      {{end}}
      {{if .ButtonURL}}
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:22px 0 6px 0;">
        <tr><td style="background:#1a1d23;border-radius:8px;">
          <a href="{{.ButtonURL}}" style="display:inline-block;padding:12px 22px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">{{.ButtonLabel}}</a>
        </td></tr>
      </table>
      <p style="margin:10px 0 0 0;font-size:12px;line-height:1.5;color:#6b7280;word-break:break-all;">{{.ButtonHint}} <a href="{{.ButtonURL}}" style="color:#6150cd;">{{.ButtonURL}}</a></p>
      {{end}}
      {{range .After}}<p style="margin:14px 0 0 0;font-size:13px;line-height:1.55;color:#6b7280;">{{.}}</p>{{end}}
    </td></tr>
    <tr><td style="padding:16px 4px 0 4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;line-height:1.5;color:#9ca3af;text-align:center;">{{.Footer}}</td></tr>
  </table>
</td></tr>
</table>
</body>
</html>{{end}}
