{{define "webhooks"}}
<div class="max-w-2xl mx-auto space-y-4">
  {{template "flash-banner" .}}
  {{template "settings-sidebar" .}}

  <div class="card bg-base-100 border border-base-300">
    <div class="card-body p-5">
      <h2 class="card-title mb-3">{{.T "wh.title"}}</h2>
      <p class="text-sm opacity-60 mb-3">{{.T "wh.blurb"}}</p>
      <form method="POST" action="/api/webhooks" class="grid gap-2 sm:grid-cols-2 mb-4">
        <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
        <input type="url" name="url" required placeholder="https://example.com/hook" class="input input-bordered sm:col-span-2">
        <input type="text" name="secret" placeholder="{{.T "wh.secret"}}" class="input input-bordered">
        <input type="text" name="events" value="session.stopped,invoice.created" class="input input-bordered">
        <div class="sm:col-span-2">
          <button type="submit" class="btn btn-neutral gap-1.5">{{icon "plus"}}{{.T "wh.add"}}</button>
        </div>
      </form>
      {{if .Items}}
      <table class="table table-sm">
        <thead><tr><th>URL</th><th>Events</th><th></th></tr></thead>
        <tbody>
          {{range .Items}}
          <tr>
            <td class="font-mono text-xs break-all">{{.URL}}</td>
            <td class="text-xs opacity-70">{{.Events}}</td>
            <td class="text-right">
              <form method="POST" action="/api/webhooks/{{.ID}}/delete" class="inline">
                <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
                <button type="submit" class="btn btn-ghost btn-xs">{{icon "trash-2" "icon icon-sm"}}</button>
              </form>
            </td>
          </tr>
          {{end}}
        </tbody>
      </table>
      <p class="text-xs opacity-60 mt-2">{{.T "wh.sig"}}</p>
      {{else}}
      <p class="text-sm opacity-60">{{.T "wh.empty"}}</p>
      {{end}}
    </div>
  </div>
</div>
{{end}}
