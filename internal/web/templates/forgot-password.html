{{define "forgot-password"}}
<div class="max-w-md mx-auto mt-12">
  <div class="card bg-base-100 border border-base-300">
    <div class="card-body p-6">
      <h1 class="mb-1">{{.T "auth.resetPassword"}}</h1>
      <p class="text-sm opacity-60 mb-4">{{.T "auth.resetBlurb"}}</p>

      {{if .ErrorMsg}}
      <div class="alert alert-error mb-4 text-sm py-2"><span>{{.ErrorMsg}}</span></div>
      {{end}}
      {{if .InfoMsg}}
      <div class="alert alert-info mb-4 text-sm py-2"><span>{{.InfoMsg}}</span></div>
      {{end}}

      <form method="POST" action="/api/password/forgot" class="space-y-3">
        <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
        <div>
          <label class="label py-1" for="email"><span class="label-text">{{.T "auth.email"}}</span></label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 class="input input-bordered w-full" value="{{.Email}}" autofocus>
        </div>
        <button type="submit" class="btn btn-neutral gap-1.5 w-full mt-2">{{icon "mail"}}{{.T "auth.sendReset"}}</button>
      </form>

      <p class="text-sm opacity-60 mt-4 text-center">
        <a href="/login" class="link link-primary">{{.T "auth.backToSignIn"}}</a>
      </p>
    </div>
  </div>
</div>
{{end}}
