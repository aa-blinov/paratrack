{{define "base"}}<!DOCTYPE html>
<html lang="{{if eq .Lang "ru"}}ru{{else}}en{{end}}" data-theme="paratrack-light"{{with .DurFmt}} data-durfmt="{{.}}"{{end}}>
<head>
  <meta charset="utf-8">
  <script src="{{asset "js/app-bootstrap.js"}}"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{.Title}} | paratrack</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1d23" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="paratrack">
  <link rel="apple-touch-icon" href="/static/icon192.png">
  <link rel="stylesheet" href="{{asset "ui/app.css"}}">
  <link rel="preload" href="/static/fonts/inter-{{if eq .Lang "ru"}}cyrillic{{else}}latin{{end}}.woff2" as="font" type="font/woff2" crossorigin>
  {{with sentryDSN}}<meta name="sentry" content="{{.}}" data-release="{{release}}" data-env="{{sentryEnv}}">
  <script src="{{asset "js/sentry.min.js"}}"></script>
  <script src="{{asset "js/sentry-init.js"}}"></script>{{end}}
  <script type="module" blocking="render" src="{{asset "ui/app.js"}}"></script>
</head>
<body class="min-h-screen flex flex-col">
  <div id="react-page-data" hidden>{{.ReactPayload}}</div><div id="paratrack-react-root">
    <div class="app-boot" role="status" aria-live="polite" aria-busy="true">
      {{if .User}}<aside class="app-boot-sidebar" aria-hidden="true"><span class="app-shell-brand">paratrack</span></aside>{{end}}
      <div class="app-boot-content">
        <div class="app-boot-header"><span class="app-shell-brand">paratrack</span></div>
        <div class="app-boot-main"><h1>{{.Title}}</h1><p>{{if eq .Lang "ru"}}Загрузка…{{else}}Loading…{{end}}</p></div>
      </div>
    </div>
    <noscript><p class="app-boot-main">{{if eq .Lang "ru"}}Для работы paratrack включите JavaScript в браузере.{{else}}Enable JavaScript in your browser to use paratrack.{{end}}</p></noscript>
  </div>
</body>
</html>{{end}}
