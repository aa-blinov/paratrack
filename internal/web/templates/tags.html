}}

{{define "tags-list"}}
  {{if .Tags}}
  <div class="card bg-base-100 border border-base-300 mt-4">
    <div class="card-body p-5">
      <div class="card-title mb-3">{{.T "tags.all"}} ({{len .Tags}})</div>
      <div class="flex flex-wrap gap-2">
        {{range .Tags}}
        <div class="badge badge-lg badge-outline gap-2 py-3 h-auto max-w-full">
          <span>#{{.Name}}</span>
          <span class="opacity-50" aria-hidden="true">/</span>
          <span class="font-mono font-semibold" title="{{.T "tags.countTitle"}}">{{.SessionCount}}</span>
          {{if $.CanManage}}<button class="btn btn-ghost btn-xs btn-circle ml-1"
                  hx-delete="/api/tags?id={{.ID}}"
                  hx-target="#tags-list" hx-swap="innerHTML"
                  hx-confirm="{{.T "tags.confirmDelete"}}"
                  title="{{.T "tags.delete"}}"
                  aria-label="{{.T "tags.delete"}}">✕</button>{{end}}
        </div>
        {{end}}
      </div>
      <p class="text-sm opacity-60 mt-3">{{.T "tags.filterHint"}}</p>
    </div>
  </div>
  {{else}}
  <div class="text-center py-8 opacity-60 mt-4">
    <div class="font-medium">{{.T "tags.noTags"}}</div>
    <div class="text-sm">{{.T "tags.noTagsHint"}}</div>
  </div>
  {{end}}
{{end}}
