}}

{{define "schedule-row"}}
{{/* . is schedRowVM */}}
<tr id="sch-row-{{.Row.UserID}}">
  <td class="sticky left-0 bg-base-100 z-10">
    <div class="font-medium grid-name truncate" title="{{.Row.UserName}}">{{.Row.UserName}}</div>
    <div class="text-xs opacity-60 font-mono">{{.Row.Total}} ({{.Row.LoadPct}}%)</div>
  </td>
  {{range .Row.Cells}}
  <td class="text-center p-1 {{if .IsToday}}bg-base-200{{end}}">
    {{if $.CanManage}}
    <input type="number" min="0" max="1440" step="30"
           class="input input-xs input-bordered w-16 text-center font-mono"
           name="minutes"
           value="{{if .Min}}{{.Min}}{{end}}"
           placeholder="—"
           title="{{.ISO}}: {{$.T "sch.dayAll"}} {{.Total}}"
           aria-label="{{$.Row.UserName}} {{.ISO}}"
           hx-post="/api/schedule/cell"
           hx-trigger="change"
           hx-vals='{"user_id": {{$.Row.UserID}}, "project_id": {{$.ProjectID}}, "date": "{{.ISO}}"}'
           hx-target="#sch-row-{{$.Row.UserID}}"
           hx-swap="outerHTML">
    {{else}}
    <span class="font-mono text-sm" title="{{$.T "sch.dayAll"}} {{.Total}}">{{if .Min}}{{.Min}}{{else}}—{{end}}</span>
    {{end}}
  </td>
  {{end}}
  <td class="text-right font-mono">{{.Row.Total}}</td>
</tr>
{{end}}
