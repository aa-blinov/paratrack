{{define "reset-password"}}
<div class="max-w-md mx-auto mt-12">
  <div class="card bg-base-100 border border-base-300">
    <div class="card-body p-6">
      <h1 class="mb-1">{{.T "auth.choosePassword"}}</h1>
      <p class="text-sm opacity-60 mb-4">{{.T "auth.resetOnce"}}</p>

      {{if .ErrorMsg}}
      <div class="alert alert-error mb-4 text-sm py-2"><span>{{.ErrorMsg}}</span></div>
      {{end}}

      <form method="POST" action="/api/password/reset" class="space-y-3">
        <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
        <input type="hidden" name="token" value="{{.Token}}">
        <div>
          <label class="label py-1" for="new_password"><span class="label-text">{{.T "auth.newPassword"}}</span></label>
          <input type="password" id="new_password" name="new_password" required minlength="8" maxlength="72"
                 autocomplete="new-password" class="input input-bordered w-full" autofocus>
          <p class="text-xs opacity-60 mt-1">{{.T "auth.passwordHint"}}</p>
        </div>
        <button type="submit" class="btn btn-neutral gap-1.5 w-full mt-2">{{icon "check"}}{{.T "projects.save"}} password</button>
      </form>
    </div>
  </div>
</div>
{{end}}
