{{define "register"}}
<div class="max-w-md mx-auto mt-12">
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body p-6">
      <h1 class="text-2xl font-semibold mb-1">Create your paratrack account</h1>
      <p class="text-sm opacity-60 mb-4">A personal workspace is created automatically, invite teammates later from <code>Settings → Team</code>.</p>

      {{if .ErrorMsg}}
      <div class="alert alert-error mb-4 text-sm py-2">
        <span>{{.ErrorMsg}}</span>
      </div>
      {{end}}

      <form method="POST" action="/api/register" class="space-y-3">
        <div>
          <label class="label py-1" for="name"><span class="label-text">Display name</span></label>
          <input type="text" id="name" name="name" required minlength="1" autocomplete="name"
                 class="input input-bordered w-full" value="{{.Name}}" autofocus>
        </div>
        <div>
          <label class="label py-1" for="email"><span class="label-text">Email</span></label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 class="input input-bordered w-full" value="{{.Email}}">
        </div>
        <div>
          <label class="label py-1" for="password"><span class="label-text">Password</span></label>
          <input type="password" id="password" name="password" required minlength="8" maxlength="72"
                 autocomplete="new-password" class="input input-bordered w-full">
          <p class="text-xs opacity-60 mt-1">8 characters or more.</p>
        </div>
        <button type="submit" class="btn btn-neutral w-full mt-2">Create account</button>
      </form>

      <p class="text-sm opacity-60 mt-4 text-center">
        Already have an account?
        <a href="/login" class="link link-primary">Log in</a>
      </p>
    </div>
  </div>
</div>
{{end}}
