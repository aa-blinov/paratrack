}}

{{define "session-row"}}
<tr id="row-{{.ID}}">
  <td data-label="{{.T "dash.activity"}}"><span class="inline-flex min-w-0 max-w-full items-start gap-1.5"><span aria-hidden="true" class="mt-1.5 w-2 h-2 rounded-full shrink-0" style="background-color: {{.Color}}"></span><span class="activity-name">{{.ActivityName}}</span></span>{{with .PersonName}}<span class="block text-xs doc-muted">{{.}}</span>{{end}}</td>
  <td data-label="{{.T "dash.startLabel"}}" class="font-mono">
    <input type="datetime-local" name="start_at" aria-label="{{.T "dash.startLabel"}} — {{.ActivityName}}"
           value="{{.StartInput}}"
           hx-patch="/api/sessions/{{.ID}}"
           hx-include="#row-{{.ID}} [name='end_at'],[name='note']"
           hx-trigger="change"
           hx-target="#row-{{.ID}}"
           hx-swap="outerHTML"
           class="input input-sm input-bordered">
  </td>
  <td data-label="{{.T "stats.end"}}" class="font-mono">
    <input type="datetime-local" name="end_at" aria-label="{{.T "stats.end"}} — {{.ActivityName}}"
           value="{{.EndInput}}"
           hx-patch="/api/sessions/{{.ID}}"
           hx-include="#row-{{.ID}} [name='start_at'],[name='note']"
           hx-trigger="change"
           hx-target="#row-{{.ID}}"
           hx-swap="outerHTML"
           class="input input-sm input-bordered">
  </td>
  <td data-label="{{.T "dash.duration"}}" class="font-mono">
    <input type="text" name="duration" value="{{.DurationInput}}"
           aria-label="{{.T "dash.duration"}} — {{.ActivityName}}"
           placeholder="{{.T "ph.duration"}}"
           title="{{.T "stats.durationTitle"}}"
           class="input input-sm input-bordered w-24"
           data-resize-session="{{.ID}}">
    {{if and .DurationSecs .Duration}}{{end}}
  </td>
  <td data-label="{{.T "stats.note"}}">
    <input type="text" name="note" value="{{.Note}}"
           aria-label="{{.T "stats.note"}} — {{.ActivityName}}"
           placeholder="{{.T "dash.noteShort"}}"
           hx-patch="/api/sessions/{{.ID}}"
           hx-include="#row-{{.ID}} [name='start_at'],[name='end_at']"
           hx-trigger="change"
           hx-target="#row-{{.ID}}"
           hx-swap="outerHTML"
           class="input input-sm input-bordered w-full">
  </td>
  <td data-label="{{.T "stats.tags"}}">
    <div class="flex flex-wrap items-center gap-1">
      {{range .Tags}}<span class="badge badge-outline gap-1">#{{.Name}}<button class="btn btn-ghost btn-xs btn-circle opacity-60" hx-delete="/api/sessions/{{$.ID}}/tags?name={{urlquery .Name}}" hx-target="#row-{{$.ID}}" hx-swap="outerHTML" aria-label="{{$.T "stats.removeTag"}}">×</button></span>{{end}}
      <span class="join">
        <input type="text"
               id="tag-input-{{.ID}}"
               aria-label="{{.T "stats.addTag"}} — {{.ActivityName}}"
               placeholder="{{.T "stats.addTag"}}"
               list="known-tags-all"
               name="name"
               hx-post="/api/sessions/{{.ID}}/tags"
               hx-trigger="keydown[key=='Enter'] from:input"
               hx-include="this"
               hx-target="#row-{{.ID}}"
               hx-swap="outerHTML"
               class="input input-xs input-bordered join-item w-20">
        <button type="button"
                class="btn btn-neutral btn-xs join-item"
                title="{{.T "stats.attachTag"}}"
                aria-label="{{.T "stats.attachTag"}}"
                hx-post="/api/sessions/{{.ID}}/tags"
                hx-trigger="click"
                hx-include="#tag-input-{{.ID}}"
                hx-target="#row-{{.ID}}"
                hx-swap="outerHTML">+</button>
      </span>
    </div>
  </td>
  <td data-label="" class="text-right">
    <button class="btn btn-ghost btn-sm btn-circle"
            title="{{.T "stats.deleteSession"}}"
            aria-label="{{.T "stats.deleteSession"}}"
            hx-delete="/api/sessions/{{.ID}}"
            hx-confirm="{{.T "stats.confirmDelete"}}"
            hx-target="#row-{{.ID}}"
            hx-swap="delete">✕</button>
  </td>
</tr>
{{end}}
