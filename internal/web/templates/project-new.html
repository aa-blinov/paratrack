{{define "project-new"}}
<div class="max-w-md mx-auto space-y-6">
  <div class="text-sm">
    <a href="/projects" class="link link-hover opacity-70">Projects</a>
    <span class="opacity-40"> / </span>
    <span>New</span>
  </div>

  <header>
    <h1 class="text-2xl font-semibold">New project</h1>
    <p class="opacity-70 text-sm mt-1">Slug is auto-derived from the name if left empty.</p>
  </header>

  <form method="POST" action="/projects/new" class="card bg-base-100 border border-base-300 shadow-sm">
    <div class="card-body p-5 gap-4">
      <label class="form-control">
        <span class="label-text">Name</span>
        <input type="text" name="name" required minlength="1"
               class="input input-bordered" placeholder="EORA RAG">
      </label>

      <label class="form-control">
        <span class="label-text">Slug (optional)</span>
        <input type="text" name="slug" pattern="[a-z0-9][a-z0-9_-]*"
               class="input input-bordered font-mono" placeholder="eora-rag">
      </label>

      <label class="form-control">
        <span class="label-text">Color</span>
        <div class="flex items-center gap-2">
          <input type="color" name="color" value="#7c3aed"
                 class="w-10 h-10 rounded border border-base-300 bg-transparent cursor-pointer">
          <input type="text" name="color" value="#7c3aed"
                 class="input input-bordered flex-1 font-mono" pattern="^#[0-9a-fA-F]{6}$">
        </div>
      </label>

      <div class="flex items-center justify-between gap-2 pt-2">
        <a href="/projects" class="btn btn-ghost btn-sm">Cancel</a>
        <button type="submit" class="btn btn-primary btn-sm">Create</button>
      </div>
    </div>
  </form>
</div>
{{end}}
