{{define "project-new"}}
<div class="space-y-6">
  <div class="text-sm">
    <a href="/projects" class="link link-hover opacity-70">{{.T "nav.projects"}}</a>
    <span class="opacity-40"> / </span>
    <span>{{.T "project.newCrumb"}}</span>
  </div>

  <header>
    <h1>{{.T "projects.new"}}</h1>
    <p class="opacity-70 text-sm mt-1">{{.T "projects.slugHint"}}</p>
  </header>

  <form method="POST" action="/projects/new" class="card bg-base-100 border border-base-300 form-measure">
        <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
    <div class="card-body p-5 gap-4">
      <label class="form-control">
        <span class="label-text">{{.T "projects.name"}}</span>
        <input type="text" name="name" required minlength="1"
               class="input input-bordered w-full" placeholder="EORA RAG">
      </label>

      <label class="form-control">
        <span class="label-text">{{.T "projects.slugOpt"}}</span>
        <input type="text" name="slug" pattern="[a-z0-9][a-z0-9_\-]*"
               class="input input-bordered font-mono w-full" placeholder="eora-rag">
      </label>

      <fieldset class="form-control">
        <legend class="label-text">{{.T "projects.color"}}</legend>
        <div class="flex items-center gap-2">
          <input type="color" name="color" value="#7c3aed" aria-label="{{.T "projects.colorPicker"}}"
                 class="w-10 h-10 rounded border border-base-300 bg-transparent cursor-pointer">
          <input type="text" name="color" value="#7c3aed" aria-label="{{.T "projects.colorHex"}}"
                 class="input input-bordered flex-1 min-w-0 font-mono" pattern="^#[0-9a-fA-F]{6}$">
        </div>
      </fieldset>

      <div class="grid gap-3 sm:grid-cols-2">
        <label class="form-control">
          <span class="label-text">{{.T "bill.rate"}} {{.T "bill.cents"}} <span class="opacity-70">({{.T "projects.optional"}})</span></span>
          <input type="text" name="rate" inputmode="decimal" autocomplete="off" class="input input-bordered w-full" placeholder="{{.T "bill.ratePh"}}">
          <span class="text-xs opacity-70 mt-1">{{.T "bill.rateHint"}}</span>
        </label>
        <label class="form-control">
          <span class="label-text">{{.T "proj.currency"}}</span>
          <select name="currency" class="select select-bordered w-full">
            <option value="">{{.T "proj.currencyInherit"}} ({{.TeamCurrency}})</option>
            {{range .Currencies}}<option value="{{.Code}}">{{.Label}}</option>{{end}}
          </select>
        </label>
      </div>

      <div class="flex items-center justify-between gap-2 pt-2">
        <a href="/projects" class="btn btn-ghost btn-sm gap-1.5">{{.T "projects.cancel"}}</a>
        <button type="submit" class="btn btn-neutral btn-sm gap-1.5">{{icon "plus"}}{{.T "projects.create"}}</button>
      </div>
    </div>
  </form>
</div>
{{end}}
