}}

{{define "timesheet-row"}}
<tr id="ts-row-{{.ActivityID}}">
  <td class="sticky left-0 bg-base-100 z-10">
    <span class="grid-name flex items-center gap-1.5 min-w-0" title="{{.ActivityName}}"><span class="inline-block w-2 h-2 rounded-full flex-shrink-0" style="background-color: {{.Color}}"></span><span class="truncate">{{.ActivityName}}</span></span>
  </td>
  {{range .Cells}}
  <td class="text-center p-1 {{if .IsToday}}bg-base-200{{end}}">
    <input type="number" min="0" max="1440" step="5"
           class="input input-xs input-bordered w-16 text-center font-mono"
           name="minutes"
           value="{{if .Secs}}{{.Min}}{{end}}"
           placeholder="—"
           title="{{.ISO}}" aria-label="{{$.ActivityName}} — {{.ISO}}"
           hx-post="/api/timesheet/cell"
           hx-trigger="change"
           hx-vals='{"activity_id": {{$.ActivityID}}, "date": "{{.ISO}}"}'
           hx-target="#ts-row-{{$.ActivityID}}"
           hx-swap="outerHTML">
  </td>
  {{end}}
  <td class="text-right font-mono whitespace-normal leading-tight">{{.RowTotalLabel}}</td>
</tr>
{{end}}
